<!DOCTYPE html>
<html>
<head>
<title>Escape the Glitch</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080A0F;
    color: white;
}

header {
    text-align: center;
    padding: 45px 20px;
    background: linear-gradient(135deg, #09051D, #101820);
    border-bottom: 2px solid #00ffff;
}

h1 {
    font-size: 50px;
    margin: 0;
    color: #00ffff;
    text-shadow: 3px 3px #ff00ff;
}

.subtitle {
    color: #aaa;
    font-size: 18px;
}

.status {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 18px;
    border: 1px solid #00ffff;
    border-radius: 20px;
    color: #00ffff;
}

.play-button {
    display: inline-block;
    margin-top: 25px;
    background: #00ffff;
    color: #000;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 18px;
    transition: 0.2s;
}

.play-button:hover {
    background: #ff00ff;
    color: white;
    transform: scale(1.05);
}

nav {
    text-align: center;
    padding: 15px;
    background: #0d1117;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
}

nav a:hover {
    color: #00ffff;
}

section {
    max-width: 1000px;
    margin: auto;
    padding: 40px 20px;
}

h2 {
    color: #00ffff;
    border-left: 4px solid #ff00ff;
    padding-left: 10px;
}

.card-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    flex: 1;
    min-width: 220px;
    background: #11161d;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #252d36;
}

.card h3 {
    color: #ff00ff;
}

.code {
    background: #11161d;
    padding: 18px;
    margin: 12px 0;
    border-radius: 10px;
    border-left: 4px solid #00ffff;
}

.warning {
    background: #18130d;
    border: 1px solid #ffaa00;
    padding: 20px;
    border-radius: 10px;
    color: #ffcc66;
}

footer {
    text-align: center;
    padding: 30px;
    background: #05070a;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>ESCAPE THE GLITCH</h1>
    </body>
</html>
